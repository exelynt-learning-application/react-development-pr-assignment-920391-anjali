
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Font Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Welcome to My Website</h1>

    <p>
        HTML is used to create web pages, while CSS is used
        to style and design them. CSS helps make websites
        attractive and user-friendly.
    </p>

</body>
</html>

h1 {
    font-size: 36px;
    color: #123b70;
    text-align: center;
}

p {
    font-size: 20px;
    color: #555555;
    line-height: 1.6;
}
